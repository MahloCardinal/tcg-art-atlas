<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#20232d" />
  <meta name="description" content="TCG Art Atlas — Catalogo personale di artwork Pokémon e One Piece." />
  <meta name="application-name" content="TCG Art Atlas" />
  <title>TCG Art Atlas — Catalogo carte</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="stylesheet" href="./style.css" />
  <script defer src="./catalog.js"></script>
  <script defer src="./review-notes.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#gallery">Vai alle carte</a>
  <header class="app-header directory-header"><div class="app-header-inner">
    <h1><a id="home-link" href="#espansioni/pokemon" aria-label="TCG Art Atlas — Espansioni Pokémon"><img class="site-logo" src="./logos/tcg_art_atlas_logo.webp" alt="TCG Art Atlas" width="88" height="64" /></a></h1>
    <details class="game-picker" id="game-picker"><summary aria-label="Scegli gioco"><span class="game-logo"><img id="current-game-logo" src="./logos/pokemon_logo.webp" alt="Pokémon Trading Card Game" width="112" height="40"/></span><span class="picker-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 9 5 5 5-5"/></svg></span></summary><div class="game-options" role="group" aria-label="Gioco"><button data-game="pokemon" aria-pressed="true"><img src="./logos/pokemon_logo.webp" alt="Pokémon Trading Card Game" width="112" height="40"/></button><button data-game="onepiece" aria-pressed="false"><img src="./logos/onepiece_logo.webp" alt="One Piece Card Game" width="112" height="40"/></button></div></details>
    <nav class="view-tabs" aria-label="Viste">
      <button data-view="expansions" class="active" aria-current="page"><span data-icon="layers"></span><span class="tab-label"><span>Espansioni</span><span class="tab-label-reserve" aria-hidden="true">Espansioni</span></span></button>
      <button data-view="catalog"><span data-icon="cards"></span><span class="tab-label"><span>Catalogo</span><span class="tab-label-reserve" aria-hidden="true">Catalogo</span></span></button>
      <button data-view="illustrators"><span data-icon="artists"></span><span class="tab-label"><span>Illustratori</span><span class="tab-label-reserve" aria-hidden="true">Illustratori</span></span></button>
      <button data-view="favorites"><span data-icon="heart"></span><span class="tab-label"><span>Preferiti</span><span class="tab-label-reserve" aria-hidden="true">Preferiti</span></span></button>
    </nav>
  </div></header>
  <div class="layout show-expansions">
    <section id="filters" hidden class="filters" aria-label="Filtri catalogo">
      <div class="filter-topline"><label class="search-filter" for="search"><span>Nome, codice o artista</span><span class="search-input"><span data-icon="search"></span><input id="search" type="search" placeholder="Cerca per nome, codice o illustratore…" autocomplete="off" /></span></label><div class="filter-meta"><span id="filter-count" class="filter-count">Nessun filtro attivo</span><button id="reset-filters" disabled class="secondary-button filter-reset" aria-label="Azzera filtri" title="Azzera filtri"><span data-icon="reset"></span><span>Azzera filtri</span></button></div></div>
      <div class="filter-bar">
        <details id="set-filter" class="multi-filter"><summary><span class="filter-label">Espansione</span><span class="filter-value">Tutte</span></summary><div class="filter-options" role="group" aria-label="Espansioni"></div></details>
        <details id="category-filter" class="multi-filter" hidden><summary><span class="filter-label">Tipo</span><span class="filter-value">Tutti</span></summary><div class="filter-options" role="group" aria-label="Tipi One Piece"></div></details>
        <details id="rarity-filter" class="multi-filter"><summary><span class="filter-label">Rarità</span><span class="filter-value">Tutte</span></summary><div class="filter-options" role="group" aria-label="Rarità"></div></details>
        <details id="type-filter" class="multi-filter"><summary><span class="filter-label" id="type-filter-label">Tipo</span><span class="filter-value">Tutti</span></summary><div class="filter-options" role="group" aria-label="Tipi"></div></details>
        <label class="select-filter" for="art-filter"><span>Artwork</span><select id="art-filter"><option value="standard" selected>Standard</option><option value="alternative">Alternativi</option><option value="all">Tutti</option></select></label>
        <label class="select-filter sort-filter" for="sort"><span>Ordina per</span><select id="sort"><option value="index">Numero carta</option><option value="index-desc">Numero decrescente</option><option value="name">Nome A–Z</option><option value="name-desc">Nome Z–A</option><option value="recent">Uscita più recente</option><option value="oldest">Uscita meno recente</option></select></label>
        <label class="select-filter" for="card-size"><span>Dimensione immagini</span><select id="card-size"><option value="small">Piccole</option><option value="medium" selected>Medie</option><option value="large">Grandi</option></select></label>
      </div>
      <div id="filter-chips" class="filter-chips" aria-label="Filtri attivi" hidden></div>
    </section>
    <main class="catalog">
      <section id="expansions-page" tabindex="-1" aria-labelledby="expansions-title"><h2 id="expansions-title" class="sr-only">Espansioni</h2><section id="expansion-filters" class="directory-filters" aria-label="Filtri delle espansioni"><div class="directory-filter-fields"><div id="expansion-languages" class="language-flags" role="group" aria-label="Lingua delle espansioni"><button data-expansion-language="all" aria-label="Tutte le lingue" aria-pressed="false" title="Tutte le lingue"><span data-icon="globe"></span></button><button data-expansion-language="en" aria-label="Inglese" aria-pressed="true" title="Inglese"><svg viewBox="0 0 60 40" aria-hidden="true"><path fill="#163878" d="M0 0h60v40H0z"/><path stroke="#fff" stroke-width="9" d="m0 0 60 40M0 40 60 0"/><path stroke="#cf243a" stroke-width="4" d="m0 0 60 40M0 40 60 0"/><path stroke="#fff" stroke-width="14" d="M30 0v40M0 20h60"/><path stroke="#cf243a" stroke-width="8" d="M30 0v40M0 20h60"/></svg></button><button data-expansion-language="ja" aria-label="Giapponese" aria-pressed="false" title="Giapponese"><svg viewBox="0 0 60 40" aria-hidden="true"><path fill="#fff" d="M0 0h60v40H0z"/><circle cx="30" cy="20" r="12" fill="#bc002d"/></svg></button></div><label class="search-filter" for="expansion-search"><span class="sr-only">Nome espansione</span><span class="search-input"><span data-icon="search"></span><input id="expansion-search" type="search" placeholder="Cerca un’espansione…" autocomplete="off"/></span></label><label class="select-filter" for="expansion-category"><span class="sr-only">Categoria</span><select id="expansion-category"><option value="expansion" selected>Espansioni normali</option><option value="all">Tutte le categorie</option></select></label><button id="reset-expansion-filters" disabled class="secondary-button directory-reset filter-reset"><span data-icon="reset"></span><span>Azzera filtri</span></button></div></section><div id="expansions-grid" class="expansion-groups"></div><p id="expansions-empty" class="directory-empty" hidden>Nessuna espansione trovata.</p></section>
      <section id="illustrators-page" hidden aria-label="Illustratori"><div class="illustrator-directory-controls"><label class="search-filter illustrator-search" for="illustrator-search"><span class="sr-only">Nome illustratore</span><span class="search-input"><span data-icon="search"></span><input id="illustrator-search" type="search" placeholder="Cerca un illustratore…" autocomplete="off"/></span></label><div class="illustrator-games" role="group" aria-label="Filtra illustratori per gioco"><button class="secondary-button active" data-illustrator-game="pokemon" aria-pressed="true">Pokémon</button><button class="secondary-button" data-illustrator-game="onepiece" aria-pressed="false">One Piece</button></div></div><p id="illustrators-count" class="directory-count" role="status" aria-live="polite"></p><div id="illustrators-grid" class="illustrators-grid"></div><p id="illustrators-empty" class="directory-empty" hidden>Nessun illustratore trovato.</p></section>
      <section id="cards-page" hidden>
      <section id="favorites-heading" class="favorites-heading" aria-label="Liste preferite" hidden>
        <div class="list-toolbar"><select id="favorite-list" aria-label="Lista preferiti"></select><div class="list-actions"><button id="rename-list" class="secondary-button">Rinomina</button><button id="delete-list" class="secondary-button filter-reset">Elimina</button></div><div class="list-transfer-actions"><button class="secondary-button" data-new-list>Nuova lista</button><label class="import-button secondary-button"><span data-icon="upload"></span>Importa<input id="import-list" type="file" accept="application/json,.json" aria-label="Importa contenuto nella lista"/></label><button id="export-list" class="secondary-button"><span data-icon="download"></span>Esporta</button></div></div>
        <div class="favorite-preference"><label class="auto-save-label"><input id="auto-save-list" type="checkbox"/><span>Non chiedere lista e inserisci automaticamente nella lista</span></label><select id="default-favorite-list" aria-label="Lista per il salvataggio automatico"></select></div>
      </section>
      <header id="illustrator-heading" class="illustrator-heading" hidden><h2 id="illustrator-title"></h2><div id="illustrator-games" class="illustrator-games" role="group" aria-label="Giochi dell’illustratore"></div></header>
      <div class="catalog-toolbar" tabindex="-1">
        <p id="results-count" role="status" aria-live="polite">Caricamento…</p>
        <div class="catalog-tools"><label class="page-size-label" for="page-size"><span>Carte per pagina</span><select id="page-size"><option value="100">100</option><option value="200" selected>200</option><option value="300">300</option></select></label><nav class="page-controls" aria-label="Pagine del catalogo"><button class="icon-button" data-page="-1" aria-label="Pagina precedente"><span data-icon="left"></span></button><span id="page-info" class="page-jump"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" enterkeyhint="go" data-page-jump aria-label="Vai alla pagina"/><span aria-hidden="true">/</span><span data-page-total aria-label="Pagine totali"></span></span><button class="icon-button" data-page="1" aria-label="Pagina successiva"><span data-icon="right"></span></button></nav></div>
      </div>
      <div id="gallery" class="gallery" tabindex="-1" aria-label="Carte"></div>
      <div id="empty-state" class="empty-state" hidden></div>
      <nav id="page-bottom" class="page-bottom page-controls" aria-label="Pagine a fondo lista"><button class="icon-button" data-page="-1" aria-label="Pagina precedente"><span data-icon="left"></span></button><span id="page-info-bottom" class="page-jump"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" enterkeyhint="go" data-page-jump aria-label="Vai alla pagina in fondo alla lista"/><span aria-hidden="true">/</span><span data-page-total aria-label="Pagine totali"></span></span><button class="icon-button" data-page="1" aria-label="Pagina successiva"><span data-icon="right"></span></button></nav>
      </section>
    </main>
  </div>
  <button id="mobile-filter-toggle" class="mobile-filter-toggle" hidden aria-label="Apri filtri" aria-expanded="false" aria-controls="expansion-filters"><span data-icon="right"></span></button>
  <div id="mobile-filter-backdrop" class="mobile-filter-backdrop" hidden></div>
  <button id="back-to-top" class="secondary-button back-to-top" title="Torna in cima. Tieni premuto per spostare il pulsante orizzontalmente." hidden><span data-icon="up"></span>Torna su</button>
  <dialog id="card-dialog" class="card-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="image-dialog" class="image-dialog" aria-label="Immagine della carta a schermo intero"><button class="image-close icon-button" data-close="image-dialog" aria-label="Chiudi immagine"><span data-icon="close"></span></button><img id="fullscreen-image" alt="" /></dialog>
  <dialog id="favorite-dialog" class="list-dialog" aria-labelledby="favorite-dialog-title">
    <div class="dialog-heading"><h2 id="favorite-dialog-title">Salva nelle liste</h2><button class="icon-button" data-close="favorite-dialog" aria-label="Chiudi scelta lista"><span data-icon="close"></span></button></div>
    <p id="favorite-card-label" class="secondary-text"></p>
    <form id="favorite-form"><fieldset class="favorite-choices"><legend class="sr-only">Scegli le liste della carta</legend><div id="favorite-list-choices"></div></fieldset><div class="dialog-actions"><button type="button" class="secondary-button" data-new-list>Nuova lista</button><button type="submit" class="primary-button">Salva</button></div></form>
  </dialog>
  <dialog id="list-name-dialog" class="list-dialog" aria-labelledby="list-name-title">
    <div class="dialog-heading"><h2 id="list-name-title">Nuova lista</h2><button class="icon-button" data-close="list-name-dialog" aria-label="Chiudi nome lista"><span data-icon="close"></span></button></div>
    <form id="list-name-form"><label class="select-filter" for="list-name"><span class="sr-only">Nome della lista</span><input id="list-name" maxlength="15" pattern="[\p{L}\p{N}_.,\-]{1,15}" title="Massimo 15 lettere o numeri; ammessi anche - _ . ," required autocomplete="off"/></label><p id="list-name-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary-button" data-close="list-name-dialog">Annulla</button><button type="submit" class="primary-button">Salva lista</button></div></form>
  </dialog>
  <dialog id="delete-list-dialog" class="list-dialog" aria-labelledby="delete-list-title">
    <div class="dialog-heading"><h2 id="delete-list-title">Elimina lista</h2><button class="icon-button" data-close="delete-list-dialog" aria-label="Chiudi eliminazione lista"><span data-icon="close"></span></button></div>
    <p id="delete-list-message"></p><div class="dialog-actions"><button class="secondary-button" data-close="delete-list-dialog">Annulla</button><button id="confirm-delete-list" class="secondary-button filter-reset">Elimina</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Abilita JavaScript per usare il catalogo.</noscript>
</body>
</html>
