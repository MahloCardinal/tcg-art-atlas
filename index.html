<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Catalogo personale di carte Pokémon e One Piece." />
  <title>CList — Catalogo carte</title>
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./src/style.css" />
  <script defer src="./public/app.js" data-assets="./public/"></script>
</head>
<body>
  <a class="skip-link" href="#gallery">Vai alle carte</a>
  <header class="app-header">
    <h1><a id="home-link" href="#catalogo/pokemon" aria-label="CList — Catalogo Pokémon"><span class="brand-icon" data-icon="cards"></span>CList</a></h1>
    <details class="game-picker" id="game-picker"><summary aria-label="Scegli gioco"><img id="current-game-logo" src="./public/images/games/pokemon.webp" alt="Pokémon Trading Card Game" width="112" height="40"/><span class="picker-chevron" aria-hidden="true">⌄</span></summary><div class="game-options" role="group" aria-label="Gioco"><button data-game="pokemon" aria-pressed="true"><img src="./public/images/games/pokemon.webp" alt="Pokémon Trading Card Game" width="112" height="40"/></button><button data-game="onepiece" aria-pressed="false"><img src="./public/images/games/onepiece.webp" alt="One Piece Card Game" width="112" height="40"/></button></div></details>
    <nav class="view-tabs" aria-label="Viste">
      <button data-view="catalog" class="active" aria-current="page">Catalogo</button>
      <button data-view="expansions">Espansioni</button>
      <button data-view="favorites">Preferiti <span id="favorite-count">0</span></button>
    </nav>
    <button id="backup-open" class="icon-button" aria-label="Backup preferiti" title="Backup preferiti"><span data-icon="download"></span></button>
  </header>
  <div class="layout">
    <aside id="filters" class="filters" aria-label="Filtri catalogo">
      <div class="filter-heading"><h2>Filtri</h2><button id="filters-close" class="icon-button" aria-label="Chiudi filtri" aria-controls="filters"><span data-icon="close"></span></button></div>
      <label for="search">Nome, codice o artista</label>
      <input id="search" type="search" placeholder="Cerca…" autocomplete="off" />
      <a class="expansion-link" id="expansion-list-link" href="#espansioni/pokemon">Lista Espansioni</a>
      <details id="set-filter" class="multi-filter"><summary>Espansione <span class="filter-value">Tutte</span></summary><div class="filter-options" role="group" aria-label="Espansioni"></div></details>
      <details id="category-filter" class="multi-filter" hidden><summary>Tipo <span class="filter-value">Tutti</span></summary><div class="filter-options" role="group" aria-label="Tipi One Piece"></div></details>
      <details id="rarity-filter" class="multi-filter"><summary>Rarità <span class="filter-value">Tutte</span></summary><div class="filter-options" role="group" aria-label="Rarità"></div></details>
      <details id="type-filter" class="multi-filter"><summary><span id="type-filter-label">Tipo</span> <span class="filter-value">Tutti</span></summary><div class="filter-options" role="group" aria-label="Tipi"></div></details>
      <label for="art-filter">Artwork</label>
      <select id="art-filter"><option value="standard" selected>Standard</option><option value="alternative">Alternativi</option><option value="all">Tutti</option></select>
      <label for="sort">Ordina per</label>
      <select id="sort"><option value="index">Numero carta</option><option value="name">Nome A–Z</option><option value="recent">Uscita più recente</option><option value="oldest">Uscita meno recente</option></select>
      <label for="card-size">Dimensione immagini</label>
      <select id="card-size"><option value="small">Piccole</option><option value="medium" selected>Medie</option><option value="large">Grandi</option></select>
      <button id="reset-filters" class="secondary-button">Azzera filtri</button>
    </aside>
    <main class="catalog">
      <section id="expansions-page" hidden aria-labelledby="expansions-title"><div class="expansions-heading"><h2 id="expansions-title">Espansioni</h2></div><div id="expansions-grid" class="expansions-grid"></div></section>
      <section id="cards-page">
      <header id="illustrator-heading" class="illustrator-heading" hidden><h2 id="illustrator-title"></h2><div id="illustrator-games" class="illustrator-games" role="group" aria-label="Giochi dell’illustratore"></div></header>
      <div class="catalog-toolbar" tabindex="-1">
        <div class="results-heading"><button id="filters-open" class="icon-button" aria-label="Apri filtri" aria-controls="filters" aria-expanded="true"><span data-icon="filter"></span></button><p id="results-count" role="status" aria-live="polite">Caricamento…</p></div>
        <div class="catalog-tools"><label class="page-size-label" for="page-size"><span>Carte da mostrare per pagina</span><select id="page-size"><option value="30">30</option><option value="60" selected>60</option><option value="120">120</option></select></label><div class="page-controls"><span id="page-info"></span><button class="icon-button" data-page="-1" aria-label="Pagina precedente"><span data-icon="left"></span></button><button class="icon-button" data-page="1" aria-label="Pagina successiva"><span data-icon="right"></span></button></div></div>
      </div>
      <div id="gallery" class="gallery" tabindex="-1" aria-label="Carte"></div>
      <div id="empty-state" class="empty-state" hidden></div>
      <div id="page-bottom" class="page-bottom"><button class="secondary-button" data-page="-1">Precedente</button><span id="page-info-bottom"></span><button class="secondary-button" data-page="1">Successiva</button></div>
      </section>
    </main>
  </div>
  <dialog id="card-dialog" class="card-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="backup-dialog" class="backup-dialog" aria-labelledby="backup-title">
    <div class="dialog-heading"><h2 id="backup-title">Backup preferiti</h2><button class="icon-button" data-close="backup-dialog" aria-label="Chiudi backup"><span data-icon="close"></span></button></div>
    <p>I preferiti sono salvati in questo browser.</p>
    <p id="backup-summary"></p>
    <button id="export-backup" class="primary-button"><span data-icon="download"></span>Esporta JSON</button>
    <label class="import-button secondary-button"><span data-icon="upload"></span>Importa JSON<input id="import-backup" type="file" accept="application/json,.json" aria-label="Importa backup JSON" /></label>
    <p class="secondary-text">L’importazione unisce i preferiti. I dati dei backup precedenti vengono conservati.</p>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Abilita JavaScript per usare il catalogo.</noscript>
</body>
</html>
